<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>小程序内容采集</title>
<style>body{margin:0;background:#f3f6fa;color:#172b42;font:16px system-ui}main{max-width:1060px;margin:40px auto;padding:0 24px}h1{font-size:34px}small,.muted{color:#61758a}.panel{background:#fff;border:1px solid #dce5ee;border-radius:16px;padding:24px;margin:20px 0}label{display:block;margin:12px 0 5px}input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bccbd8;border-radius:8px;font:inherit}button,.link{background:#17635e;color:white;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;margin:8px 8px 0 0;text-decoration:none;display:inline-block}button:disabled{opacity:.4;cursor:default}.secondary{background:#e6eef5;color:#17374d}.row{display:flex;justify-content:space-between;gap:20px;align-items:center}.badge{padding:6px 12px;background:#ecf4ee;border-radius:20px}#error{color:#a62820;white-space:pre-wrap}details{margin-top:14px}h2{font-size:21px}p{line-height:1.6}</style>
<main><small>本地执行 · 按需请求 Agent · 保留来源</small><h1>把小程序内容整理出来</h1><p class="muted">先看一屏提取预览，再继续采集。重复步骤在本机运行，不请求在线模型。</p>
<section class="panel"><h2>新建采集任务</h2><label>要整理哪个小程序？</label><select id="profile"></select><label>采集范围</label><select id="scope"><option value="current">当前页面，向下滚动读取</option><option value="navigate">进入栏目和详情（需 Agent 校准路径）</option></select><label>任务名称 / 栏目</label><input id="name" placeholder="例如：本周课程目录"><label>希望整理什么？</label><input id="goal" placeholder="例如：商品名称和价格（保留为 Agent 的任务说明）"><details><summary>从已有截图提取</summary><label>图片文件夹路径</label><input id="offline" placeholder="留空则采集电脑上已打开的小程序"></details><p class="muted">从你已打开的页面开始。当前页模式只滚动；导航模式按 Agent 审核的路径进入栏目、读取详情并返回，不执行业务提交。实时采集会占用前台窗口，切换窗口将中断采集。</p><button id="create">创建任务</button><div id="error" role="alert"></div></section><h2>任务与结果</h2><section id="tasks"></section></main>
<script>
const token='__SESSION_TOKEN__';history.replaceState(null,'',location.pathname);const $=s=>document.querySelector(s);let profilesLoaded=false;
const phases={ready:'待开始',running:'采集中',preview:'预览待核对',paused:'已暂停',needs_review:'等待 Agent 判断',error:'需要处理',partial:'部分完成',stopped:'已停止'};
async function action(data){$('#error').textContent='';try{let r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','X-Token':token},body:JSON.stringify(data)});let x=await r.json();if(!r.ok)throw Error(x.error);await refresh()}catch(e){$('#error').textContent=e.message}}
function text(tag,value){let e=document.createElement(tag);e.textContent=value;return e}
async function refresh(){try{let r=await fetch('/api',{headers:{'X-Token':token}});if(!r.ok)throw Error('本地控制台连接已断开');let data=await r.json();if(!profilesLoaded){data.profiles.forEach(p=>{let o=text('option',p.name);o.value=p.path;$('#profile').append(o)});profilesLoaded=true}$('#tasks').replaceChildren();for(let t of data.tasks){let s=t.status||{},card=text('div','');card.className='panel';let head=text('div','');head.className='row';head.append(text('h2',t.collection),text('span',phases[s.phase]||s.phase||'待开始'));card.append(head,text('p',`已提取 ${s.items||0} 条 · 已处理 ${s.frames||0} 屏 · 已滚动 ${s.scrolls||0} 次`));card.append(text('p',s.message||''));if(s.phase==='needs_review')card.append(text('p','Agent 模式：由当前 Agent 审核后续跑。独立控制台不会自行调用模型。任务编号：'+t.id));for(let [label,act,enabled] of [['先看一屏','preview',s.phase==='ready'],['继续采集','continue',['preview','paused','error'].includes(s.phase)],['暂停','pause',s.phase==='running'],['停止','stop',s.phase==='running'],['再次采集','repeat',s.phase!=='running']]){let b=text('button',label);b.disabled=!enabled;b.className=act==='preview'||act==='continue'?'':'secondary';b.onclick=()=>action({action:act,id:t.id});card.append(b)}if((s.frames||0)>0){let a=text('a','查看结果与来源');a.href='/result/'+t.id+'/index.html';a.target='_blank';a.className='link';card.append(a)}$('#tasks').append(card)}}catch(e){$('#error').textContent=e.message}}
$('#create').onclick=()=>action({action:'create',profile:$('#profile').value,name:$('#name').value,goal:$('#goal').value,scope:$('#scope').value,offline:$('#offline').value});refresh();setInterval(refresh,2000);
</script></html>
